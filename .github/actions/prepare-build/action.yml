name: Prepare native and web dependencies
description: Build the embedded web UI and install native desktop/cryptography prerequisites.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 10.14.0
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: pnpm
        cache-dependency-path: web/pnpm-lock.yaml
    - name: Install Linux desktop and OpenSSL development libraries
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev pkg-config
    - name: Prepare Windows OpenSSL build tools
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        if (-not (Test-Path 'C:\Strawberry\perl\bin\perl.exe')) {
          choco install strawberryperl --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
        'C:\Strawberry\perl\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        'C:\Strawberry\c\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        if (-not (Get-Command nasm -ErrorAction SilentlyContinue) -and -not (Test-Path 'C:\Strawberry\c\bin\nasm.exe')) {
          choco install nasm --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'C:\Program Files\NASM' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        }
    - name: Build embedded web assets
      shell: bash
      run: |
        pnpm --dir web install --frozen-lockfile
        pnpm --dir web format:check
        pnpm --dir web test
        pnpm --dir web build
