name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-15
            platform: macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-build
      - name: Embed the matching release candidate version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "LOCALSHELLD_RELEASE_TAG=v${version}-rc.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust dependencies and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-
      - name: Verify PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: $PSVersionTable.PSVersion
      - name: Verify system Bash
        if: runner.os != 'Windows'
        shell: bash
        run: /bin/bash --version
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      - name: Browser and WebAuthn integration tests
        if: runner.os == 'Linux'
        run: |
          pnpm --dir web exec playwright install --with-deps chromium
          pnpm --dir web test:e2e
      - name: Browser test diagnostics
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-diagnostics
          path: web/test-results/
      - run: cargo build --release
      - name: Verify real user and root daemon identities
        if: runner.os != 'Windows'
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          python3 scripts/test-dual-daemon.py target/release/trustd
      - name: Verify embedded version
        if: env.LOCALSHELLD_RELEASE_TAG != ''
        shell: bash
        run: |
          bash scripts/verify-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: trustd-${{ matrix.platform }}
          path: |
            target/release/trustd
            target/release/trustd.exe
            target/release/trustd-user
            target/release/trustd-user.exe
            target/release/trustd-stdio
            target/release/trustd-stdio.exe
            target/release/trustd-system.exe
            target/release/trustd-root
            target/release/release-version.txt
          if-no-files-found: error
