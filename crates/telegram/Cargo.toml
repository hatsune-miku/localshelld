[package]
name = "localshelld-telegram"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = []
bot = ["dep:reqwest", "dep:tokio", "dep:uuid"]

[dependencies]
chrono = "0.4"
localshelld-sync-protocol = { path = "../sync-protocol" }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", optional = true, features = ["sync", "time", "rt", "macros"] }
uuid = { version = "1", optional = true, features = ["v4"] }
zeroize = "1"

[dev-dependencies]
axum = "0.8"
