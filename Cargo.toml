[package]
name = "localshelld"
version = "0.1.0"
edition = "2024"
description = "User-controlled local and privileged PowerShell and Bash sessions over HTTP and MCP"
license = "MIT"

[workspace]
members = ["crates/native-dialog", "crates/native-process"]

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
flate2 = "1"
fs2 = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "system-proxy"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
toml = "0.9"
totp-rs = { version = "5.7", features = ["otpauth"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
webauthn-rs = "0.5.5"
include_dir = "0.7"
mime_guess = "2"
zeroize = { version = "1", features = ["derive"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
openssl = { version = "0.10", features = ["vendored"] }
localshelld-native-dialog = { path = "crates/native-dialog" }
localshelld-native-process = { path = "crates/native-process" }

[target.'cfg(not(windows))'.dependencies]
wry = "0.54"
tao = "0.34"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
semver = "1"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
