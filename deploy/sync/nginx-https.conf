limit_req_zone $binary_remote_addr zone=localshelld_sync_requests:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=localshelld_sync_connections:10m;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    location ^~ /.well-known/acme-challenge/ { root /var/www/localshelld-sync; }
    location / { return 308 https://__DOMAIN__$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __DOMAIN__;
    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:localshelld_sync_tls:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 8m;
    client_body_timeout 15s;
    access_log /var/log/nginx/localshelld-sync.access.log;
    error_log /var/log/nginx/localshelld-sync.error.log;

    location / {
        limit_req zone=localshelld_sync_requests burst=30 nodelay;
        limit_conn localshelld_sync_connections 40;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:32121;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 40s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }
}
